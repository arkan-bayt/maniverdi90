<!DOCTYPE html>
<html lang="it" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema di Gestione Mani Verdi - Accesso</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .language-selector {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 5px;
        }

        .lang-btn {
            background: none;
            border: 2px solid #ddd;
            padding: 5px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            color: #666;
        }

        .lang-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            color: white;
            font-size: 24px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        h1 {
            color: #333;
            margin: 20px 0 10px;
            font-size: 24px;
            font-weight: 600;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-weight: 500;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* RTL Support */
        [dir="rtl"] .form-group {
            text-align: right;
        }

        [dir="rtl"] .language-selector {
            left: 15px;
            right: auto;
        }

        /* Loading Animation */
        .loading {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-btn.loading .loading {
            display: block;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .login-container {
                margin: 20px;
                padding: 30px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="language-selector">
            <button class="lang-btn" onclick="changeLanguage('ar')" id="lang-ar">عربي</button>
            <button class="lang-btn" onclick="changeLanguage('en')" id="lang-en">EN</button>
            <button class="lang-btn active" onclick="changeLanguage('it')" id="lang-it">IT</button>
        </div>

        <div class="logo">
            <i class="fas fa-leaf"></i>
        </div>
        
        <h1 id="title">Accesso</h1>
        <p class="subtitle" id="subtitle">Inserisci i tuoi dati per accedere al Sistema di Gestione Mani Verdi</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username" id="usernameLabel">Nome Utente</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password" id="passwordLabel">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="login-btn" id="loginBtn">
                <span id="loginText">Accedi</span>
                <div class="loading"></div>
            </button>
            
            <div id="message"></div>
        </form>
    </div>

    <script>
        let currentLanguage = 'it';
        
        const translations = {
            ar: {
                title: 'تسجيل الدخول',
                subtitle: 'أدخل بياناتك للوصول إلى نظام إدارة مناي ڤيردي',
                usernameLabel: 'اسم المستخدم',
                passwordLabel: 'كلمة المرور',
                loginText: 'تسجيل الدخول',
                welcomeMessage: 'مرحباً {name}! جاري التوجيه...',
                errorMessage: 'اسم المستخدم أو كلمة المرور غير صحيحة',
                alreadyLoggedIn: 'تم تسجيل الدخول مسبقاً. جاري التوجيه...',
                pageTitle: 'نظام إدارة مناي ڤيردي - تسجيل الدخول',
                superuserName: 'المدير العام',
                userName: 'مناي'
            },
            en: {
                title: 'Login',
                subtitle: 'Enter your credentials to access Mani Verdi Management System',
                usernameLabel: 'Username',
                passwordLabel: 'Password',
                loginText: 'Login',
                welcomeMessage: 'Welcome {name}! Redirecting...',
                errorMessage: 'Invalid username or password',
                alreadyLoggedIn: 'Already logged in. Redirecting...',
                pageTitle: 'Mani Verdi Management System - Login',
                superuserName: 'General Manager',
                userName: 'Mani'
            },
            it: {
                title: 'Accesso',
                subtitle: 'Inserisci i tuoi dati per accedere al Sistema di Gestione Mani Verdi',
                usernameLabel: 'Nome Utente',
                passwordLabel: 'Password',
                loginText: 'Accedi',
                welcomeMessage: 'Benvenuto {name}! Reindirizzamento...',
                errorMessage: 'Nome utente o password non validi',
                alreadyLoggedIn: 'Già effettuato l\'accesso. Reindirizzamento...',
                pageTitle: 'Sistema di Gestione Mani Verdi - Accesso',
                superuserName: 'Direttore Generale',
                userName: 'Mani'
            }
        };

        function getUsers() {
            const t = translations[currentLanguage];
            return [
                { username: 'iraq', password: 'iraq', role: 'superuser', name: t.superuserName },
                { username: 'mani', password: 'mani', role: 'user', name: t.userName }
            ];
        }

        function changeLanguage(lang) {
            currentLanguage = lang;
            
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`lang-${lang}`).classList.add('active');
            
            const html = document.documentElement;
            if (lang === 'ar') {
                html.setAttribute('dir', 'rtl');
                html.setAttribute('lang', 'ar');
            } else {
                html.setAttribute('dir', 'ltr');
                html.setAttribute('lang', lang);
            }
            
            updatePageContent();
            localStorage.setItem('loginLanguage', lang);
        }

        function updatePageContent() {
            const t = translations[currentLanguage];
            
            document.title = t.pageTitle;
            document.getElementById('title').textContent = t.title;
            document.getElementById('subtitle').textContent = t.subtitle;
            document.getElementById('usernameLabel').textContent = t.usernameLabel;
            document.getElementById('passwordLabel').textContent = t.passwordLabel;
            document.getElementById('loginText').textContent = t.loginText;
            
            const messageDiv = document.getElementById('message');
            if (messageDiv.innerHTML) {
                messageDiv.innerHTML = '';
            }
        }

        function initializeLanguage() {
            const savedLanguage = localStorage.getItem('loginLanguage') || 'it';
            changeLanguage(savedLanguage);
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            const loginBtn = document.getElementById('loginBtn');
            const t = translations[currentLanguage];
            
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;
            
            setTimeout(() => {
                const users = getUsers();
                const user = users.find(u => u.username === username && u.password === password);
                
                if (user) {
                    const welcomeMessage = t.welcomeMessage.replace('{name}', user.name);
                    messageDiv.innerHTML = `<div class="message success">${welcomeMessage}</div>`;
                    
                    localStorage.setItem('currentUser', JSON.stringify({
                        username: user.username,
                        role: user.role,
                        name: user.name
                    }));
                    
                    localStorage.setItem('language', currentLanguage);
                    
                    setTimeout(() => {
                        window.location.href = './modern-dashboard.html';
                    }, 2000);
                    
                } else {
                    messageDiv.innerHTML = `<div class="message error">${t.errorMessage}</div>`;
                    loginBtn.classList.remove('loading');
                    loginBtn.disabled = false;
                    document.getElementById('password').value = '';
                }
            }, 1000);
        });

        function checkExistingLogin() {
            const currentUser = localStorage.getItem('currentUser');
            if (currentUser) {
                const t = translations[currentLanguage];
                document.getElementById('message').innerHTML = `<div class="message success">${t.alreadyLoggedIn}</div>`;
                setTimeout(() => {
                    window.location.href = './modern-dashboard.html';
                }, 1500);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            initializeLanguage();
            checkExistingLogin();
        });
    </script>
</body>
</html>
