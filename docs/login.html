<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة مناي ڤيردي - تسجيل الدخول</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 28px;
            font-weight: bold;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            direction: ltr;
            text-align: left;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .error {
            color: #e74c3c;
            margin-top: 10px;
            font-size: 14px;
        }
        .success {
            color: #27ae60;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">MV</div>
        <h1>تسجيل الدخول</h1>
        <p>أدخل بياناتك للوصول إلى نظام إدارة مناي ڤيردي</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">اسم المستخدم</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="login-btn">تسجيل الدخول</button>
            
            <div id="message"></div>
        </form>
    </div>

    <script>
        // Mock user data - في الإنتاج يجب أن تكون هذه البيانات محمية على الخادم
        const users = [
            { username: 'iraq', password: 'iraq', role: 'superuser', name: 'المدير العام' },
            { username: 'mani', password: 'mani', role: 'user', name: 'مناي' }
        ];

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            const user = users.find(u => u.username === username && u.password === password);
            
            if (user) {
                messageDiv.innerHTML = `<div class="success">مرحباً ${user.name}! جاري التوجيه...</div>`;
                
                // حفظ بيانات المستخدم في localStorage
                localStorage.setItem('currentUser', JSON.stringify({
                    username: user.username,
                    role: user.role,
                    name: user.name
                }));
                
                // التوجيه إلى الصفحة الرئيسية بعد ثانيتين
                setTimeout(() => {
                    window.location.href = './index.html';
                }, 2000);
                
            } else {
                messageDiv.innerHTML = '<div class="error">اسم المستخدم أو كلمة المرور غير صحيحة</div>';
            }
        });
        
        // التحقق من وجود مستخدم مسجل مسبقاً
        const currentUser = localStorage.getItem('currentUser');
        if (currentUser) {
            document.getElementById('message').innerHTML = '<div class="success">تم تسجيل الدخول مسبقاً. جاري التوجيه...</div>';
            setTimeout(() => {
                window.location.href = './index.html';
            }, 1500);
        }
    </script>
</body>
</html>
